<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1024" height="1024" rx="228" fill="#1E55F9"/>

  <!-- Mic icon stylized -->
  <g transform="translate(312, 200)">
    <!-- Mic body -->
    <rect x="120" y="0" width="160" height="320" rx="80" fill="white"/>

    <!-- Mic stand arc -->
    <path d="M80 280 C80 420, 320 420, 320 280" stroke="white" stroke-width="40" fill="none" stroke-linecap="round"/>

    <!-- Mic stand vertical -->
    <rect x="180" y="380" width="40" height="120" fill="white"/>

    <!-- Mic stand base -->
    <rect x="120" y="480" width="160" height="40" rx="20" fill="white"/>
  </g>

  <!-- Soundwaves left -->
  <path d="M220 512 Q180 400, 220 288" stroke="white" stroke-width="32" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M160 512 Q100 360, 160 208" stroke="white" stroke-width="32" fill="none" stroke-linecap="round" opacity="0.3"/>

  <!-- Soundwaves right -->
  <path d="M804 512 Q844 400, 804 288" stroke="white" stroke-width="32" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M864 512 Q924 360, 864 208" stroke="white" stroke-width="32" fill="none" stroke-linecap="round" opacity="0.3"/>
</svg>
