name: Evertalk
options:
  bundleIdPrefix: com.ram902
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: 0.9.0

targets:
  Evertalk:
    type: application
    platform: macOS
    sources:
      - path: Evertalk
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ram902.evertalk
        MARKETING_VERSION: "2.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Evertalk/Info.plist
        CODE_SIGN_ENTITLEMENTS: Evertalk/Evertalk.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    dependencies:
      - package: WhisperKit
    entitlements:
      path: Evertalk/Evertalk.entitlements
